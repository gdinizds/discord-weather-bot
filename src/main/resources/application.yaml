spring:
  application:
    name: discord-weather-bot
  config:
    import: "optional:consul:,optional:file:/vault/secrets/db.yaml"

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:consul-server.consul.svc.cluster.local}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: true
        format: YAML
        data-key: data

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 5000

  flyway:
    locations: classpath:db/migration
    schemas: weather_bot
    default-schema: weather_bot

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda.redpanda.svc.cluster.local:9093}
    listener:
      concurrency: 3
    consumer:
      group-id: discord-weather-bot
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        max.poll.interval.ms: 60000
    producer:
      acks: all
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 32768

weather-bot:
  topics:
    inbound-interactions: discord.events.interaction.command
    inbound-commands: discord.events.message.command
    inbound-buttons: discord.events.interaction.button
    outbound-responses: discord.gateway.responses
    gateway-commands: discord.gateway.commands
  openmeteo:
    geocoding-url: ${OPENMETEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
    forecast-url: ${OPENMETEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
    timeout: 6s
  brasilapi:
    cep-url: ${BRASILAPI_CEP_URL:https://brasilapi.com.br/api/cep/v2}
    timeout: 4s
  session:
    ttl: 1h
  executor:
    concurrency: 32
    drain-timeout: 30s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 20s
    instances:
      weather-api:
        base-config: default
        wait-duration-in-open-state: 20s
      brasilapi:
        base-config: default
        wait-duration-in-open-state: 15s
      database:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  timelimiter:
    instances:
      weather-api:
        timeout-duration: 6s
        cancel-running-future: true
      brasilapi:
        timeout-duration: 4s
        cancel-running-future: true
  retry:
    instances:
      weather-api:
        max-attempts: 2
        wait-duration: 1s
        enable-exponential-backoff: true
      brasilapi:
        max-attempts: 2
        wait-duration: 500ms
      database:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - org.springframework.dao.DataIntegrityViolationException
  bulkhead:
    instances:
      weather:
        max-concurrent-calls: 32
        max-wait-duration: 0
      database:
        max-concurrent-calls: 10
        max-wait-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers
  endpoint:
    health:
      show-details: never
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  health:
    circuitbreakers:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
