spring:
  application:
    name: discord-weather-bot-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092

weather-bot:
  topics:
    inbound-interactions: test.discord.events.interaction.command
    inbound-commands: test.discord.events.message.command
    inbound-buttons: test.discord.events.interaction.button
    outbound-responses: test.discord.gateway.responses
    gateway-commands: test.discord.gateway.commands
  openmeteo:
    geocoding-url: http://localhost:8089/geocoding
    forecast-url: http://localhost:8089/forecast
    timeout: 2s
  brasilapi:
    cep-url: http://localhost:8089/cep
    timeout: 2s
  session:
    ttl: 1h
  executor:
    concurrency: 4
    drain-timeout: 5s
